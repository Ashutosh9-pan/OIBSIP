<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern and responsive calculator web application">
    <title>CalcPro | Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <div class="calculator">

            <div class="calculator-header">
                <div>
                    <p class="app-label">CALCULATOR</p>
                    <h1>CalcPro</h1>
                </div>

                <button
                    class="theme-toggle"
                    id="themeToggle"
                    aria-label="Toggle theme"
                    type="button"
                >
                    ☀
                </button>
            </div>

            <div class="display-container">
                <div
                    class="previous-operation"
                    id="previousOperation"
                    aria-live="polite"
                ></div>

                <div
                    class="current-display"
                    id="display"
                    aria-live="polite"
                >
                    0
                </div>
            </div>

            <div class="calculator-grid">

                <button
                    class="btn btn-function"
                    data-action="clear"
                    type="button"
                >
                    C
                </button>

                <button
                    class="btn btn-function"
                    data-action="backspace"
                    type="button"
                    aria-label="Delete last character"
                >
                    ⌫
                </button>

                <button
                    class="btn btn-function"
                    data-action="percent"
                    type="button"
                >
                    %
                </button>

                <button
                    class="btn btn-operator"
                    data-operator="/"
                    type="button"
                >
                    ÷
                </button>


                <button class="btn btn-number" data-number="7" type="button">
                    7
                </button>

                <button class="btn btn-number" data-number="8" type="button">
                    8
                </button>

                <button class="btn btn-number" data-number="9" type="button">
                    9
                </button>

                <button
                    class="btn btn-operator"
                    data-operator="*"
                    type="button"
                >
                    ×
                </button>


                <button class="btn btn-number" data-number="4" type="button">
                    4
                </button>

                <button class="btn btn-number" data-number="5" type="button">
                    5
                </button>

                <button class="btn btn-number" data-number="6" type="button">
                    6
                </button>

                <button
                    class="btn btn-operator"
                    data-operator="-"
                    type="button"
                >
                    −
                </button>


                <button class="btn btn-number" data-number="1" type="button">
                    1
                </button>

                <button class="btn btn-number" data-number="2" type="button">
                    2
                </button>

                <button class="btn btn-number" data-number="3" type="button">
                    3
                </button>

                <button
                    class="btn btn-operator"
                    data-operator="+"
                    type="button"
                >
                    +
                </button>


                <button
                    class="btn btn-function"
                    data-action="sign"
                    type="button"
                >
                    +/−
                </button>

                <button class="btn btn-number" data-number="0" type="button">
                    0
                </button>

                <button
                    class="btn btn-number"
                    data-action="decimal"
                    type="button"
                >
                    .
                </button>

                <button
                    class="btn btn-equals"
                    data-action="calculate"
                    type="button"
                >
                    =
                </button>

            </div>

            <div class="keyboard-hint">
                <span>⌨</span>
                Keyboard input supported
            </div>

        </div>

        <footer class="app-footer">
            <p>Designed & Developed by Ashutosh Panwar</p>
            <p class="project-tag">Oasis Infobyte • Web Development Internship</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
